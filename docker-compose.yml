version: '3.8'

services:
  # 1. PostgreSQL OLTP & Analytical Database (Phase 3)
  postgres:
    image: postgres:15-alpine
    container_name: audienceiq_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: audienceiq_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  # 2. Neo4j Graph Database (Phase 9)
  neo4j:
    image: neo4j:5.12.0
    container_name: audienceiq_neo4j
    restart: always
    ports:
      - "7474:7474"   # Neo4j Browser Web UI (http://localhost:7474)
      - "7687:7687"   # Bolt Driver Connection
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
